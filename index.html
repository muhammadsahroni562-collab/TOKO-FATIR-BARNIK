<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOKO FATIR</title>
<style>body{font-family:sans-serif;background:#f6f3ee;margin:0;padding:20px}h1{color:#12372a}button{padding:14px 20px;background:#12372a;color:#d9ff6a;border:0;border-radius:12px;font-weight:900;width:100%}</style>
</head><body>
<h1>TOKO FATIR BARNIK</h1>
<p>Jika kamu lihat tulisan ini, toko sudah hidup!</p>
<button onclick="document.getElementById('galeri').style.display='block'">📸 BUKA GALERI</button>
<div id="galeri" style="display:none;margin-top:20px;background:white;padding:16px;border-radius:12px">
<p>Pilih foto dari HP:</p>
<input type="file" accept="image/*" onchange="preview(event)">
<img id="img" style="width:100%;margin-top:10px;border-radius:10px;display:none">
<input id="nama" placeholder="Nama produk" style="width:100%;padding:10px;margin-top:10px">
<input id="harga" type="number" placeholder="Harga" style="width:100%;padding:10px;margin-top:10px">
<button onclick="alert('Produk '+nama.value+' disimpan!')" style="margin-top:10px">Simpan</button>
</div>
<script>
function preview(e){
  var r=new FileReader();
  r.onload=function(ev){var i=document.getElementById('img');i.src=ev.target.result;i.style.display='block'};
  r.readAsDataURL(e.target.files[0]);
}
</script>
</body></html>
