<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKO FATIR BARNIK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f1f4eb}
.header{padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;background:#f1f4eb;z-index:5}
.logo{background:#12372a;color:#d9ff6a;padding:10px 18px;border-radius:12px;font-weight:900}
.hero{margin:12px;background:#12372a;color:white;border-radius:20px;padding:20px}
.hero span{color:#d9ff6a}
.btns{margin:12px;display:flex;gap:8px}
.btns button{flex:1;padding:14px;border:none;border-radius:12px;font-weight:900}
.b1{background:#111;color:#d9ff6a;border:2px solid #d9ff6a}
.b2{background:white}
.search{margin:12px;background:white;padding:12px;border-radius:12px;display:flex;gap:8px}
.search input{border:none;width:100%;outline:none}
.grid{margin:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:white;border-radius:16px;overflow:hidden}
.card img{width:100%;height:140px;object-fit:cover;background:#eee}
.card-body{padding:10px}
.price{font-weight:900;color:#12372a}
.act{display:flex;gap:6px;margin-top:6px}
.act button{flex:1;padding:8px;border:none;border-radius:8px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:99}
.modal.show{display:flex}
.box{background:white;width:100%;max-width:400px;border-radius:18px;padding:16px;max-height:90vh;overflow:auto}
.box input,.box textarea,.box select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:6px 0}
.preview{width:100%;height:180px;object-fit:cover;border-radius:12px;display:none;margin-top:8px;background:#eee}
.save{width:100%;background:#12372a;color:#d9ff6a;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:10px}
.cart{position:fixed;bottom:0;left:0;right:0;background:#12372a;color:white;padding:14px;border-radius:20px 20px 0 0;transform:translateY(120%);transition:.3s;z-index:80}
.cart.show{transform:translateY(0)}
</style>
</head>
<body>
<div class="header"><div class="logo">FATIR BARNIK</div><button onclick="openCart()" style="background:#111;color:#d9ff6a;border:none;padding:8px 14px;border-radius:20px">🛒 <span id="cCount">0</span></button></div>
<div class="hero"><h2>Selamat Datang di<br>Toko Kami<br>Belanja pilihan, lebih <span>mudah.</span></h2><p style="opacity:.7;font-size:13px;margin-top:8px">Tambah produk asli dari galeri HP</p></div>
<div class="btns"><button class="b1" onclick="openAdd()">📸 + TAMBAH PRODUK</button><button class="b2" onclick="clearAll()">🗑️ Reset</button></div>
<div class="search">🔍 <input id="q" placeholder="Cari produk..." oninput="render()"></div>
<div class="grid" id="list"></div>

<div class="cart" id="cart"><div style="display:flex;justify-content:space-between"><b>Keranjang</b><button onclick="closeCart()" style="background:white;border:none;padding:4px 10px;border-radius:12px">Tutup</button></div><div id="cList" style="margin-top:10px"></div><div id="cTotal" style="font-weight:900;margin-top:10px"></div><input id="custName" placeholder="Nama pemesan" style="width:100%;padding:10px;border-radius:10px;border:none;margin-top:10px"><button onclick="checkout()" style="width:100%;background:#d9ff6a;color:#12372a;padding:12px;border:none;border-radius:12px;font-weight:900;margin-top:8px">Checkout WA</button></div>

<div class="modal" id="m" onclick="if(event.target==this)closeM()"><div class="box">
<h3 id="mTitle">Tambah Produk</h3>
<label>📸 Foto dari Galeri HP (Wajib)</label><input type="file" id="fFoto" accept="image/*" onchange="prev(this)"><img id="prev" class="preview">
<label>📝 Nama Produk</label><input id="fNama" placeholder="Ember Biru Besar">
<label>📝 Deskripsi</label><textarea id="fDesk" placeholder="Deskripsi produk"></textarea>
<label>📦 Kategori</label><select id="fKat"><option>Kamar mandi</option><option>Dapur</option><option>Kebersihan</option><option>Rumah</option></select>
<label>💰 Harga</label><input id="fHarga" type="number" placeholder="35000">
<label>📦 Stok</label><input id="fStok" type="number" placeholder="10">
<input type="hidden" id="fId">
<button class="save" onclick="save()">💾 SIMPAN PRODUK</button>
<button onclick="closeM()" style="width:100%;margin-top:8px;padding:10px;border:none;background:#eee;border-radius:10px">Batal</button>
</div></div>
