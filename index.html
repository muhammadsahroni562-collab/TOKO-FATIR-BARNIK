<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOKO FATIR BARNIK 089682006784</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#f2f5e9;color:#10261c}.top{position:sticky;top:0;background:#f2f5e9;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}.logo{width:40px;height:40px;background:#12372a;border-radius:10px;display:grid;place-items:center;color:#d9ff6a;font-weight:900}.btn-cart{background:#111;color:#d9ff6a;border:2px solid #d9ff6a;padding:10px 14px;border-radius:999px;font-weight:800}.banner{margin:12px;background:#12372a;color:#fff;border-radius:22px;padding:20px}.banner span{color:#d9ff6a}.actions{margin:12px;display:flex;gap:10px}.btn-add{flex:1;background:#111;color:#d9ff6a;border:2px solid #d9ff6a;padding:14px;border-radius:14px;font-weight:800}.btn-reset{background:#fff;border:1px solid #ccc;padding:14px;border-radius:14px}.grid{margin:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.06)}.card img{width:100%;height:140px;object-fit:cover;background:#eee}.card-body{padding:10px}.name{font-weight:800;font-size:13px}.desc{font-size:11px;opacity:.6;height:28px;overflow:hidden}.price{font-weight:900;color:#12372a;margin-top:6px}.row{display:flex;justify-content:space-between;align-items:center}.plus{width:32px;height:32px;border:none;background:#12372a;color:#d9ff6a;border-radius:8px;font-weight:900}.editrow{display:flex;gap:6px;margin-top:8px}.editrow button{flex:1;padding:7px;border:none;border-radius:8px;font-size:11px;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:99}.modal.show{display:flex}.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:16px;max-height:90vh;overflow:auto}.sheet input,.sheet textarea,.sheet select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:12px;margin-top:6px}.sheet label{font-size:12px;font-weight:700;margin-top:10px;display:block}.preview{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}.save{width:100%;background:#12372a;color:#d9ff6a;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:12px}.cart{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;border-radius:22px 22px 0 0;padding:16px;transform:translateY(100%);transition:.3s;z-index:98}.cart.show{transform:translateY(0)}</style></head><body><div class="top"><div style="display:flex;gap:8px;align-items:center"><div class="logo">FB</div><div><b style="font-size:14px">FATIR BARNIK</b><div style="font-size:11px;opacity:.6">WA 089682006784</div></div></div><button class="btn-cart" onclick="openCart()">🛒 <span id="cnt">0</span></button></div><div class="banner"><h1>Belanja <span>Perabot Rumah</span> Murah</h1><p style="margin-top:8px;font-size:12px;opacity:.7">Upload foto asli dari galeri HP langsung jadi produk!</p></div><div class="actions"><button class="btn-add" onclick="openAdd()">📸 + TAMBAH PRODUK</button><button class="btn-reset" onclick="if(confirm('Reset?')){localStorage.clear();location.reload()}">🗑️</button></div><div style="margin:0 12px"><input id="q" placeholder="Cari ember, sapu..." oninput="render()" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd"></div><div class="grid" id="list"></div><div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div class="sheet"><b id="mt">Tambah Produk</b><label>Foto Produk</label><input type="file" id="fFoto" accept="image/*" onchange="previewFoto(this)"><img id="pv" class="preview"><label>Nama Produk</label><input id="fNama"><label>Deskripsi</label><textarea id="fDesk" rows="2"></textarea><label>Kategori</label><select id="fKat"><option>Kamar mandi</option><option>Dapur</option><option>Kebersihan</option><option>Rumah</option><option>Lainnya</option></select><label>Harga Rp</label><input id="fHarga" type="number"><label>Stok</label><input id="fStok" type="number" value="10"><input type="hidden" id="fId"><button class="save" onclick="saveP()">💾 SIMPAN PRODUK</button><button onclick="closeM()" style="width:100%;margin-top:8px;padding:12px;border:none;background:#eee;border-radius:12px">Batal</button></div></div><div class="cart" id="cartBox"><div style="display:flex;justify-content:space-between"><b>Keranjang</b><button onclick="closeCart()" style="padding:6px 12px;border-radius:999px;border:none">Tutup</button></div><div id="cList" style="margin-top:10px"></div><div id="cTot" style="margin-top:10px;font-weight:900;color:#d9ff6a"></div><input id="cName" placeholder="Nama kamu" style="width:100%;padding:12px;border-radius:12px;border:none;margin-top:10px"><button onclick="checkout()" style="width:100%;background:#d9ff6a;color:#12372a;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:10px">Checkout WA 089682006784</button></div><script>const WA='6289682006784';let prods=JSON.parse(localStorage.getItem('fb_final')||'null');if(!prods){prods=[{nama:'Ember 25L Jumbo',desk:'Tebal anti pecah',harga:45000,stok:20,kat:'Kamar mandi',foto:'https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=500'},{nama:'Gayung Mandi',desk:'Lentur nyaman',harga:15000,stok:30,kat:'Kamar mandi',foto:'https://images.unsplash.com/photo-1584305574586-0a33e7399cc8?w=500'},{nama:'Sapu Ijuk',desk:'Ijuk rapat kuat',harga:28000,stok:15,kat:'Kebersihan',foto:'https://images.unsplash.com/photo-1583947581924-860bda6a26df?w=500'}];localStorage.setItem('fb_final',JSON.stringify(prods))}let cart=[];let tmp='';function render(){const q=document.getElementById('q').value.toLowerCase();const list=document.getElementById('list');list.innerHTML=prods.filter(p=>p.nama.toLowerCase().includes(q)).map((p,i)=>{const idx=prods.indexOf(p);return `<div class=card><img src="${p.foto}"><div class=card-body><div class=name>${p.nama}</div><div class=desc>${p.desk} • Stok ${p.stok}</div><div class=row><div class=price>Rp ${Number(p.harga).toLocaleString('id-ID')}</div><button class=plus onclick="addCart(${idx})">+</button></div><div class=editrow><button style="background:#e8f5e9" onclick="editP(${idx})">Edit</button><button style="background:#ffebee" onclick="delP(${idx})">Hapus</button></div></div></div>`}).join('')}function addCart(i){let f=cart.find(c=>c.i==i);if(f)f.q++;else cart.push({i,q:1});upd();openCart()}function upd(){document.getElementById('cnt').innerText=cart.reduce((a,b)=>a+b.q,0);let t=0;let html='';cart.forEach(c=>{let p=prods[c.i];t+=p.harga*c.q;html+=`<div style="display:flex;justify-content:space-between;margin:6px 0"><span>${p.nama} x${c.q}</span><span>Rp ${(p.harga*c.q).toLocaleString('id-ID')}</span></div>`});document.getElementById('cList').innerHTML=html||'Kosong';document.getElementById('cTot').innerText=t?`Total Rp ${t.toLocaleString('id-ID')}`:''}function openCart(){document.getElementById('cartBox').classList.add('show')}function closeCart(){document.getElementById('cartBox').classList.remove('show')}function checkout(){if(!cart.length)return alert('Kosong');let n=document.getElementById('cName').value||'Pembeli';let msg=`Halo Toko FATIR BARNIK saya ${n} mau pesan:%0A`;let tot=0;cart.forEach(c=>{let p=prods[c.i];tot+=p.harga*c.q;msg+=`- ${p.nama} x${c.q} Rp ${(p.harga*c.q).toLocaleString('id-ID')}%0A`});msg+=`Total Rp ${tot.toLocaleString('id-ID')}`;window.location.href=`https://wa.me/${WA}?text=${msg}`}function openAdd(){document.getElementById('mt').innerText='Tambah Produk';['fNama','fDesk','fHarga','fStok','fId'].forEach(id=>document.getElementById(id).value='');tmp='';document.getElementById('pv').style.display='none';document.getElementById('modal').classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}function previewFoto(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{tmp=e.target.result;let pv=document.getElementById('pv');pv.src=tmp;pv.style.display='block'};r.readAsDataURL(f)}function saveP(){let nama=document.getElementById('fNama').value.trim();let desk=document.getElementById('fDesk').value.trim();let harga=document.getElementById('fHarga').value;let stok=document.getElementById('fStok').value||10;let kat=document.getElementById('fKat').value;let id=document.getElementById('fId').value;if(!nama||!harga)return alert('Isi nama & harga');if(!tmp)return alert('Pilih foto dulu');let d={nama,desk,harga:Number(harga),stok:Number(stok),kat,foto:tmp};if(id!=='')prods[Number(id)]=d;else prods.unshift(d);localStorage.setItem('fb_final',JSON.stringify(prods));closeM();render()}function editP(i){let p=prods[i];document.getElementById('fNama').value=p.nama;document.getElementById('fDesk').value=p.desk;document.getElementById('fHarga').value=p.harga;document.getElementById('fStok').value=p.stok;document.getElementById('fKat').value=p.kat;document.getElementById('fId').value=i;tmp=p.foto;let pv=document.getElementById('pv');pv.src=tmp;pv.style.display='block';document.getElementById('modal').classList.add('show')}function delP(i){if(confirm('Hapus produk?')){prods.splice(i,1);localStorage.setItem('fb_final',JSON.stringify(prods));render()}}render();upd();</script></body></html>
