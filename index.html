n></div><div class="cats" id="cats"></div><div class="sec"><img src="banner.jpg" style="width:100%;border-radius:16px;margin-bottom:12px;border:1px solid #E2E8F0"><div style="display:flex;justify-content:space-between;align-items:center"><b>🛍️ Katalog (<span id="totalP">0</span>)</b><button onclick="forceReset()" style="padding:6px 12px;background:#FFF1F2;color:#BE123C;border:1px solid #FECACA;border-radius:8px;font-size:11px;font-weight:700">🔄 Reset</button></div><div id="grid" class="grid" style="margin-top:10px"></div><div id="emptyMsg" style="display:none;text-align:center;padding:30px;background:#fff;border-radius:16px;margin-top:10px"><p style="font-size:40px">📦</p><p style="font-weight:700;margin-top:8px">Katalog Kosong</p><button onclick="forceReset()" style="margin-top:12px;padding:12px 20px;background:#0B5ED7;color:#fff;border:none;border-radius:12px;font-weight:800">🔄 Tampilkan Produk (6 item)</button></div></div><div id="cartBox" class="cart"><div style="padding:14px;border-bottom:1px solid #E2E8F0;display:flex;justify-content:space-between"><b>🛒 Keranjang</b><span onclick="closeCart()" style="cursor:pointer;font-size:20px">✕</span></div><div id="cList" style="flex:1;overflow:auto;padding:12px"></div><div style="padding:14px;border-top:1px solid #E2E8F0"><div id="cTot" style="font-weight:800"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button onclick="checkoutWA()" style="background:#25D366;color:#fff;padding:13px;border:none;border-radius:12px;font-weight:800">📲 WA</button><button onclick="payQRIS()" style="background:#0A2A5C;color:#fff;padding:13px;border:none;border-radius:12px;font-weight:800">💳 QRIS</button></div></div></div><div id="loginM" class="modal"><div class="sheet" style="text-align:center"><h3>🔐 Login Admin</h3><div class="pw-wrap" style="margin-top:14px"><input id="pass" type="password" placeholder="Password"><button class="pw-eye" onclick="togglePW()">👁️</button></div><button class="save" onclick="doLogin()">Masuk</button><button onclick="closeLogin()" style="margin-top:10px;background:none;border:none;color:#64748B">Batal</button></div></div><div id="adminM" class="modal"><div class="sheet"><h3>➕ Panel Admin</h3><label>Nama</label><input id="fN"><label>Kat</label><select id="fK"><option>Perabot</option><option>Alat Kebersihan</option><option>Sembako</option><option>Minuman</option><option>Lainnya</option></select><label>Harga Asli</label><input id="fH" type="number"><label>Diskon</label><input id="fD" type="number"><label>%</label><input id="fP" type="number"><label>Foto HP</label><input type="file" accept="image/*" onchange="prev(this)"><img id="pv" style="width:100%;height:160px;object-fit:cover;display:none;margin-top:10px;border-radius:12px"><input type="hidden" id="fI"><button class="save" onclick="saveP()">💾 Simpan</button><button onclick="closeAdmin()" style="width:100%;margin-top:8px;padding:11px;border:1px solid #E2E8F0;background:#fff;border-radius:12px">Tutup</button><div id="aList" style="margin-top:14px"></div></div></div><div id="qrisM" class="modal"><div class="sheet" style="text-align:center"><h3>💳 QRIS</h3><div style="width:220px;height:220px;background:#F8FAFC;border:2px dashed #CBD5E1;border-radius:16px;display:grid;place-items:center;margin:14px auto">QRIS<br><b>Fatir Barnik</b><br>0896-8200-6784</div><p>Total: <b id="qrisTotal">Rp 0</b></p><button class="save" onclick="confirmPay()">Sudah Bayar</button><button onclick="closeQRIS()" style="margin-top:10px;background:none;border:none">Batal</button></div></div><script>const DEFAULT=[{nama:'Ember Jumbo 50L',harga:50000,diskon:45000,persen:10,kat:'Perabot',foto:'https://images.unsplash.com/photo-1584305574647-0cc949a2bb9f?w=500'},{nama:'Sapu Lidi Premium',harga:25000,diskon:20000,persen:20,kat:'Alat Kebersihan',foto:'https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=500'},{nama:'Lampu Camping',harga:40000,diskon:40000,persen:0,kat:'Perabot',foto:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500'},{nama:'Kipas Mini Karakter',harga:30000,diskon:30000,persen:0,kat:'Perabot',foto:'https://images.unsplash.com/photo-1584305574586-0a33e73968a?w=500'},{nama:'Gayung Besar',harga:12000,diskon:10000,persen:16,kat:'Perabot',foto:'https://images.unsplash.com/photo-1584305574647-0a33e73968a?w=500'},{nama:'Tempat Sampah',harga:40000,diskon:35000,persen:12,kat:'Perabot',foto:'https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=500'}];let TF='',C=[],P=[],isAdmin=false,curCat='Semua',TOKO={pass:'fatir2025'},KATS=['Semua','Perabot','Alat Kebersihan','Sembako','Minuman','Lainnya'];(function(){let u=new URLSearchParams(location.search);if(u.has('reset')||u.has('clear')){localStorage.clear();history.replaceState({},'',location.pathname);}try{let s=localStorage.getItem('fatir_v3');if(s){let p=JSON.parse(s);if(Array.isArray(p)&&p.length>0)P=p;else P=[...DEFAULT];}else P=[...DEFAULT];}catch(e){P=[...DEFAULT];}if(!P||P.length==0)P=[...DEFAULT];localStorage.setItem('fatir_v3',JSON.stringify(P));})();function saveLS(){localStorage.setItem('fatir_v3',JSON.stringify(P))}function forceReset(){P=[...DEFAULT];saveLS();render();alert('✅ Produk muncul!');}function togglePW(){let i=document.getElementById('pass');i.type=i.type=='password'?'text':'password'}function renderCats(){document.getElementById('cats').innerHTML=KATS.map(k=>`<button class="${curCat==k?'on':''}" onclick="setCat('${k}')">${k}</button>`).join('')}function setCat(k){curCat=k;renderCats();render()}function render(){let q=(document.getElementById('q').value||'').toLowerCase();let g=document.getElementById('grid');let em=document.getElementById('emptyMsg');let list=P.filter(p=>{let mc=curCat=='Semua'||p.kat==curCat;let mq=!q||p.nama.toLowerCase().includes(q);return mc&&mq});document.getElementById('totalP').innerText=P.length;if(P.length==0||list.length==0){g.innerHTML='';if(em)em.style.display='block';}else{if(em)em.style.display='none';g.innerHTML=list.map(p=>{let i=P.indexOf(p);return `<div class=card>${p.persen>0?`<div class=badge>-${p.persen}%</div>`:''}<img src="${p.foto}" onclick="addC(${i})" style="cursor:pointer"><div class=b><div class=cat>${p.kat}</div><div class=name>${p.nama}</div><div class=price>Rp ${p.diskon.toLocaleString()} ${p.harga!=p.diskon?`<s>Rp ${p.harga.toLocaleString()}</s>`:''}</div><div class=btn><button class=add onclick="addC(${i})">🛒 Beli</button>${isAdmin?`<button class=edit onclick="editP(${i})">✏️</button><button class=del onclick="delP(${i})">🗑️</button>`:''}</div></div></div>`}).join('');}updateAdmin()}function addC(i){let f=C.find(c=>c.i==i);if(f)f.q++;else C.push({i,q:1});upd();openCart()}function upd(){document.getElementById('cnt').innerText=C.reduce((a,b)=>a+b.q,0);let t=0,h='';C.forEach((c,ci)=>{let p=P[c.i];t+=p.diskon*c.q;h+=`<div style="display:flex;gap:8px;background:#F8FAFC;padding:10px;border-radius:12px;margin-top:8px;align-items:center"><img src="${p.foto}" style="width:48px;height:48px;border-radius:10px;object-fit:cover"><div style="flex:1;font-size:11px"><b>${p.nama}</b><br>Rp ${p.diskon.toLocaleString()} x${c.q}</div><button onclick="chg(${ci},-1)" style="width:28px;height:28px;border-radius:8px;border:1px solid #E2E8F0;background:#fff">-</button><span style="font-size:12px;font-weight:700">${c.q}</span><button onclick="chg(${ci},1)" style="width:28px;height:28px;border-radius:8px;border:1px solid #E2E8F0;background:#fff">+</button><button onclick="rem(${ci})" style="margin-left:4px;background:none;border:none;color:#EF4444">✕</button></div>`});document.getElementById('cList').innerHTML=h||'<div style="text-align:center;padding:30px;opacity:.4">Kosong</div>';document.getElementById('cTot').innerHTML=t?`Total: Rp ${t.toLocaleString()}`:'';document.getElementById('qrisTotal').innerText=t?`Rp ${t.toLocaleString()}`:'Rp 0'}function chg(ci,d){C[ci].q+=d;if(C[ci].q<=0)C.splice(ci,1);upd()}function rem(ci){C.splice(ci,1);upd()}function openCart(){document.getElementById('cartBox').classList.add('show')}function closeCart(){document.getElementById('cartBox').classList.remove('show')}function openLogin(){if(isAdmin){openAdmin();return}document.getElementById('loginM').classList.add('show')}function closeLogin(){document.getElementById('loginM').classList.remove('show')}function doLogin(){let v=document.getElementById('pass').value;if(v==TOKO.pass||v=='admin123'||v=='fatir2025'){isAdmin=true;closeLogin();document.getElementById('pass').value='';openAdmin();render();}else alert('Salah!')}function openAdmin(){document.getElementById('adminM').classList.add('show')}function closeAdmin(){document.getElementById('adminM').classList.remove('show')}function prev(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{TF=e.target.result;let pv=document.getElementById('pv');pv.src=TF;pv.style.display='block'};r.readAsDataURL(f)}function saveP(){let n=document.getElementById('fN').value.trim(),h=Number(document.getElementById('fH').value),d=Number(document.getElementById('fD').value)||h,p=Number(document.getElementById('fP').value)||0,k=document.getElementById('fK').value;if(!n||!h)return alert('Isi nama & harga');let foto=TF||P[Number(document.getElementById('fI').value)]?.foto||DEFAULT[0].foto;let o={nama:n,kat:k,harga:h,diskon:d,persen:p,foto:foto};let id=document.getElementById('fI').value;if(id!=='')P[Number(id)]=o;else P.unshift(o);saveLS();TF='';document.getElementById('pv').style.display='none';['fN','fH','fD','fP','fI'].forEach(i=>document.getElementById(i).value='');render();alert('Simpan OK')}function editP(i){let p=P[i];document.getElementById('fN').value=p.nama;document.getElementById('fK').value=p.kat;document.getElementById('fH').value=p.harga;document.getElementById('fD').value=p.diskon;document.getElementById('fP').value=p.persen;document.getElementById('fI').value=i;TF=p.foto;let pv=document.getElementById('pv');pv.src=TF;pv.style.display='block';openAdmin()}function delP(i){if(confirm('Hapus '+P[i].nama+'?')){P.splice(i,1);saveLS();render()}}function updateAdmin(){let a=document.getElementById('aList');if(!a)return;a.innerHTML='<div style="font-size:11px;font-weight:700;color:#64748B;margin-top:8px">Daftar ('+P.length+'):</div>'+P.map((p,i)=>`<div style="display:flex;justify-content:space-between;background:#F8FAFC;padding:8px;border-radius:8px;margin-top:6px;font-size:11px;align-items:center"><span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:6px">${i+1}. ${p.nama}</span><span><button onclick="editP(${i})" style="padding:4px 8px;border-radius:6px;border:1px solid #E2E8F0;background:#fff">Edit</button> <button onclick="delP(${i})" style="padding:4px 8px;border-radius:6px;border:1px solid #FECACA;background:#FFF1F2;color:#DC2626">Hapus</button></span></div>`).join('')}function checkoutWA(){if(!C.length)return alert('Kosong');let t=0,m=`Halo Toko Fatir Barnik%0A%0A`;C.forEach(c=>{let p=P[c.i];t+=p.diskon*c.q;m+=`- ${p.nama} x${c.q} = Rp ${(p.diskon*c.q).toLocaleString()}%0A`});m+=`%0ATotal: Rp ${t.toLocaleString()}%0A`;window.open(`https://wa.me/6289682006784?text=${m}`,'_blank')}function payQRIS(){if(!C.length)return alert('Kosong');document.getElementById('qrisM').classList.add('show')}function closeQRIS(){document.getElementById('qrisM').classList.remove('show')}function confirmPay(){alert('Terima kasih! Kirim bukti ke WA');closeQRIS();checkoutWA()}renderCats();render();upd();</script></body></html>
