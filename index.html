</div>

<div><b>📍 Jl. Raya Pebayuran Kp. Kramat RT18/06</b><br>Kedungwaringin Bekasi - WA: 0896-8200-6784</div>

<div id="grid" class="p-4 grid grid-cols-2 md:grid-cols-4 gap-3 max-w-6xl mx-auto"></div>

<div id="admin" class="fixed inset-0 bg-black/50 hidden z-50 p-4 overflow-auto"><div class="bg-white max-w-md mx-auto rounded-2xl p-5 mt-6"><div class="flex justify-between mb-3"><b>Admin PIN:1234</b><button onclick="document.getElementById('admin').classList.add('hidden')">X</button></div><input id="pin" type="password" placeholder="PIN" class="w-full border rounded-xl p-3 text-sm mb-2"><button onclick="if(document.getElementById('pin').value=='1234'){document.getElementById('form').classList.remove('hidden');this.style.display='none'}else alert('PIN salah')" class="w-full bg-black text-white py-2 rounded-full text-sm mb-3">Buka Panel</button><div id="form" class="hidden"><div class="bg-gray-50 p-3 rounded-xl space-y-2 mb-3"><label class="text-xs font-bold">📸 Foto dari galeri:</label><input id="pfile" type="file" accept="image/*" class="w-full text-xs bg-white p-2 border rounded-lg"><img id="preview" class="hidden w-full h-32 object-contain bg-white rounded-lg mt-2 border"><input id="pn" placeholder="Nama produk" class="w-full border rounded-lg p-2.5 text-sm"><input id="ph" type="number" placeholder="Harga" class="w-full border rounded-lg p-2.5 text-sm"><select id="pk" class="w-full border rounded-lg p-2.5 text-sm"><option value="barnik">Barnik</option><option value="dapur">Dapur</option><option value="kebersihan">Kebersihan</option><option value="rumah">Rumah</option></select><button onclick="add()" class="w-full bg-green-600 text-white py-2.5 rounded-full text-sm font-bold">+ Tambah</button></div><div id="alist" class="space-y-2 max-h-96 overflow-auto"></div></div></div></div>
<script>
// AUTO HAPUS DATA LAMA YANG ADA PLASTIK - FIX KERANJANG
localStorage.removeItem('fb3_p');
localStorage.removeItem('fb3_c');

let defs=[
{id:1,nama:"Barnik Jumbo Merah",harga:15000,kat:"barnik",img:"🧺"},
{id:2,nama:"Ember Besar + Gayung",harga:25000,kat:"kebersihan",img:"🪣"},
{id:3,nama:"Rak Piring 2 Susun Stainless",harga:75000,kat:"dapur",img:"🍽️"},
{id:4,nama:"Sapu Lantai + Pengki Set",harga:22000,kat:"kebersihan",img:"🧹"},
{id:5,nama:"Toples Kaca Set Isi 3",harga:45000,kat:"dapur",img:"🫙"},
{id:6,nama:"Keranjang Laundry Tutup",harga:35000,kat:"barnik",img:"🧺"},
{id:7,nama:"Pel Lantai Peras",harga:38000,kat:"kebersihan",img:"🧹"},
{id:8,nama:"Rak Sepatu Susun 4",harga:55000,kat:"rumah",img:"👟"}
];
let produk=defs;
let cart=[];
let kat='semua';let tempImg='';
document.getElementById('pfile').addEventListener('change',function(e){
let f=e.target.files[0];if(!f)return;
let r=new FileReader();r.onload=function(ev){tempImg=ev.target.result;let pv=document.getElementById('preview');pv.src=tempImg;pv.classList.remove('hidden')};r.readAsDataURL(f)
});
function save(){localStorage.setItem('fb3_p',JSON.stringify(produk));localStorage.setItem('fb3_c',JSON.stringify(cart))}
function rp(n){return 'Rp '+n.toLocaleString('id-ID')}
function setK(k){kat=k;document.querySelectorAll('[id^=k]').forEach(b=>b.className='bg-white border px-4 py-2 rounded-full text-xs');let el=document.getElementById('k'+k);if(el)el.className='bg-green-600 text-white px-4 py-2 rounded-full text-xs';render()}
function render(){
let g=document.getElementById('grid');g.innerHTML='';
let q=document.getElementById('search').value.toLowerCase();
produk.filter(p=>(kat=='semua'||p.kat==kat)&&p.nama.toLowerCase().includes(q)).forEach(p=>{
let im=(p.img&&p.img.startsWith('data:'))?`<img src="${p.img}" class="h-24 w-full object-contain">`:p.img.startsWith('http')?`<img src="${p.img}" class="h-20 object-contain">`:`<div class="text-4xl">${p.img}</div>`;
g.innerHTML+=`<div class="bg-white rounded-xl border p-3 flex flex-col"><div class="bg-gray-50 rounded-lg h-28 flex items-center justify-center overflow-hidden">${im}</div><p class="text-[10px] bg-green-50 text-green-700 px-2 py-0.5 rounded-full inline mt-2 w-fit">${p.kat}</p><p class="font-semibold text-xs mt-1">${p.nama}</p><p class="font-bold text-green-600 text-sm">${rp(p.harga)}</p><button onclick="addC(${p.id})" class="mt-2 w-full bg-gray-900 text-white py-2 rounded-full text-xs">+ Keranjang</button></div>`
})
}
function addC(id){let p=produk.find(x=>x.id==id);let c=cart.find(x=>x.id==id);if(c)c.qty++;else cart.push({...p,qty:1});save();up();document.getElementById('cart').classList.remove('hidden')}
function up(){let co=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('c1').innerText=co;document.getElementById('c2').innerText=co;let t=0,h='';cart.forEach((it,i)=>{t+=it.harga*it.qty;h+=`<div class="bg-gray-50 p-3 rounded-xl flex justify-between"><div class="flex gap-2"><div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center overflow-hidden">${it.img.startsWith('data:')||it.img.startsWith('http')?`<img src="${it.img}" class="w-full h-full object-contain">`:`<span>${it.img}</span>`}</div><div><p class="text-sm font-semibold">${it.nama}</p><p class="text-xs">${rp(it.harga)} x ${it.qty}</p><div class="flex gap-2 mt-1"><button onclick="ch(${i},-1)" class="w-6 h-6 bg-white border rounded-full">-</button><span class="text-sm">${it.qty}</span><button onclick="ch(${i},1)" class="w-6 h-6 bg-white border rounded-full">+</button></div></div></div><button onclick="rm(${i})" class="text-red-500 text-xs">Hapus</button></div>`});document.getElementById('list').innerHTML=h||'<p class="text-center text-gray-400 mt-20">Kosong</p>';document.getElementById('total').innerText=rp(t)}
function ch(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();up()}
function rm(i){cart.splice(i,1);save();up()}
function add(){let n=document.getElementById('pn').value;let h=parseInt(document.getElementById('ph').value);let k=document.getElementById('pk').value;let im=tempImg||'📦';if(!n||!h)return alert('Isi nama & harga!');produk.unshift({id:Date.now(),nama:n,harga:h,kat:k,img:im});save();render();rA
