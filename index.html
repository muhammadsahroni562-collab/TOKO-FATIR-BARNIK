<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKO FATIR BARNIK - Perlengkapan Rumah Lengkap</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#f4f6ef;color:#14281e}
.header{position:sticky;top:0;z-index:50;background:rgba(244,246,239,.9);backdrop-filter:blur(10px);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;background:#12372a;border-radius:12px;display:grid;place-items:center;color:#d9ff6a;font-weight:800}
.cart-btn{background:#111;color:#d9ff6a;border:2px solid #d9ff6a;padding:10px 16px;border-radius:999px;font-weight:800;display:flex;gap:8px}
.banner{margin:14px;background:radial-gradient(120% 120% at 0% 0%, #1a4a39 0%, #12372a 60%);border-radius:26px;padding:22px 20px;color:#fff;position:relative;overflow:hidden}
.banner h1{font-size:24px;line-height:1.15;max-width:220px}
.banner h1 span{color:#d9ff6a}
.stats{margin-top:14px;display:flex;gap:8px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:8px 12px;border-radius:14px;font-size:12px}
.stat b{color:#d9ff6a}
.actions{margin:14px;display:grid;grid-template-columns:1.4fr .6fr;gap:10px}
.btn-add{background:#111;color:#d9ff6a;border:2px solid #d9ff6a;padding:16px;border-radius:16px;font-weight:800;font-size:14px}
.btn-reset{background:#fff;border:1px solid #ddd;padding:16px;border-radius:16px;font-weight:700}
.filters{margin:0 14px;display:flex;gap:8px;overflow:auto}
.chip{white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid #ddd;background:#fff;font-weight:700;font-size:12px}
.chip.active{background:#12372a;color:#d9ff6a;border-color:#12372a}
.search{margin:12px 14px;background:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:10px}
.search input{border:none;outline:none;width:100%;font-size:14px}
.grid{margin:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.06)}
