<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TOKO FATIR BARNIK</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#f1f4eb}.h{padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;background:#f1f4eb;z-index:9}.logo{background:#12372a;color:#d9ff6a;padding:10px 18px;border-radius:12px;font-weight:900}.hero{margin:12px;background:#12372a;color:white;border-radius:20px;padding:20px}.hero span{color:#d9ff6a}.btns{margin:12px;display:flex;gap:8px}.btns button{flex:1;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:15px}.b1{background:#111;color:#d9ff6a;border:2px solid #d9ff6a}.b2{background:white}.search{margin:12px;background:white;padding:12px;border-radius:12px;display:flex;gap:8px}.search input{border:none;width:100%;outline:none}.grid{margin:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}.card img{width:100%;height:140px;object-fit:cover}.card-body{padding:10px}.price{font-weight:900;color:#12372a}.act{display:flex;gap:6px;margin-top:6px}.act button{flex:1;padding:8px;border:none;border-radius:8px;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:99}.modal.show{display:flex}.box{background:white;width:100%;max-width:400px;border-radius:18px;padding:16px;max-height:90vh;overflow:auto}.box input,.box textarea,.box select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:6px 0}.preview{width:100%;height:180px;object-fit:cover;border-radius:12px;display:none;margin-top:8px}.save{width:100%;background:#12372a;color:#d9ff6a;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:10px}.cart{position:fixed;bottom:0;left:0;right:0;background:#12372a;color:white;padding:14px;border-radius:20px 20px 0 0;transform:translateY(120%);transition:.3s;z-index:80}.cart.show{transform:translateY(0)}</style></head><body>
<div class="h"><div class="logo">FATIR BARNIK</div><button onclick="openCart()" style="background:#111;color:#d9ff6a;border:none;padding:8px 14px;border-radius:20px">🛒 <span id="cCount">0</span></button></div>
<div class="hero"><h2>Selamat Datang di Toko Kami<br>Belanja pilihan, lebih <span>mudah.</span></h2><p style="opacity:.7;font-size:13px;margin-top:8px">📸 Upload foto asli dari Galeri HP</p></div>
<div class="btns"><button class="b1" onclick="openAdd()">📸 + TAMBAH PRODUK</button><button class="b2" onclick="if(confirm('Reset toko?')){localStorage.clear();location.reload()}">🗑️ Reset</button></div>
<div class="search">🔍 <input id="q" placeholder="Cari produk..." oninput="render()"></div>
<div class="grid" id="list"></div>
<div class="cart" id="cart"><div style="display:flex;justify-content:space-between"><b>Keranjang</b><button onclick="closeCart()" style="background:white;border:none;padding:4px 10px;border-radius:12px">Tutup</button></div><div id="cList" style="margin-top:10px"></div><div id="cTotal" style="font-weight:900;margin-top:10px"></div><input id="custName" placeholder="Nama pemesan" style="width:100%;padding:10px;border-radius:10px;border:none;margin-top:10px"><button onclick="checkout()" style="width:100%;background:#d9ff6a;color:#12372a;padding:12px;border:none;border-radius:12px;font-weight:900;margin-top:8px">Checkout WA</button></div>
<div class="modal" id="m" onclick="if(event.target==this)closeM()"><div class="box"><h3 id="mTitle">Tambah Produk</h3><label>📸 Foto dari Galeri HP</label><input type="file" id="fFoto" accept="image/*" onchange="prev(this)"><img id="prev" class="preview"><label>📝 Nama Produk</label><input id="fNama" placeholder="Ember Biru Besar"><label>📝 Deskripsi</label><textarea id="fDesk" placeholder="Deskripsi"></textarea><label>📦 Kategori</label><select id="fKat"><option>Kamar mandi</option><option>Dapur</option><option>Kebersihan</option><option>Rumah</option></select><label>💰 Harga</label><input id="fHarga" type="number" placeholder="35000"><label>📦 Stok</label><input id="fStok" type="number" placeholder="10"><input type="hidden" id="fId"><button class="save" onclick="save()">💾 SIMPAN PRODUK</button><button onclick="closeM()" style="width:100%;margin-top:8px;padding:10px;border:none;background:#eee;border-radius:10px">Batal</button></div></div>
<script>
const defaults=[{nama:'Ember 20L',desk:'Kuat tebal',harga:35000,stok:20,kat:'Kamar mandi',foto:'https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400'},{nama:'Gayung',desk:'Plastik premium',harga:12000,stok:50,kat:'Kamar mandi',foto:'https://images.unsplash.com/photo-1584305574586-0a33e7399cc8?w=400'},{nama:'Sapu',desk:'Ijuk kuat',harga:25000,stok:30,kat:'Kebersihan',foto:'https://images.unsplash.com/photo-1583947581924-860bda6a26df?w=400'}];
let products=JSON.parse(localStorage.getItem('fb_v3')||'null');
if(!products||!Array.isArray(products)||products.length==0||!products[0].foto){products=[...defaults];localStorage.setItem('fb_v3',JSON.stringify(products));}
let cart=[];let tmp='';
function render(){const q=document.getElementById('q').value.toLowerCase();const el=document.getElementById('list');el.innerHTML=products.filter(p=>p.nama.toLowerCase().includes(q)).map((p,i)=>`<div class="card"><img src="${p.foto}"><div class="card-body"><small style="background:#eef2e3;padding:2px 6px;border-radius:10px;font-size:10px">${p.kat}</small><div style="font-weight:800;margin:4px 0">${p.nama}</div><small style="opacity:.6">${p.desk}</small><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><div class="price">Rp ${Number(p.harga).toLocaleString('id-ID')}</div><button onclick="add(${i})" style="width:30px;height:30px;border-radius:8px;border:none;background:#12372a;color:#d9ff6a;font-weight:900">+</button></div><div class="act"><button style="background:#e8f5e9" onclick="edit(${i})">✏️ Edit</button><button style="background:#ffebee" onclick="del(${i})">🗑️ Hapus</button></div></div></div>`).join('');}
function add(i){let f=cart.find(c=>c.i==i);if(f)f.q++;else cart.push({i,q:1});upd();}
function upd(){document.getElementById('cCount').innerText=cart.reduce((a,b)=>a+b.q,0);let t=0;document.getElementById('cList').innerHTML=cart.map(c=>{const p=products[c.i];t+=p.harga*c.q;return `<div style="display:flex;justify-content:space-between"><span>${p.nama} x${c.q}</span><span>Rp ${(p.harga*c.q).toLocaleString('id-ID')}</span></div>`}).join('');document.getElementById('cTotal').innerText='Total: Rp '+t.toLocaleString('id-ID');}
function openCart(){document.getElementById('cart').classList.add('show')}function closeCart(){document.getElementById('cart').classList.remove('show')}
function checkout(){if(!cart.length)return alert('Kosong');const n=document.getElementById('custName').value||'Pelanggan';let msg=`Halo Toko Fatir Barnik, saya ${n} pesan:%0A`;let tot=0;cart.forEach(c=>{const p=products[c.i];tot+=p.harga*c.q;msg+=`- ${p.nama} x${c.q}%0A`});msg+=`Total Rp ${tot.toLocaleString('id-ID')}`;window.open('https://wa.me/6281234567890?text='+msg,'_blank');}
function openAdd(){document.getElementById('mTitle').innerText='📸 Tambah Produk';['fNama','fDesk','fHarga','fStok','fId'].forEach(id=>document.getElementById(id).value='');tmp='';document.getElementById('prev').style.display='none';document.getElementById('m').classList.add('show');}
function edit(i){const p=products[i];document.getElementById('mTitle').innerText='✏️ Edit Produk';document.getElementById('fNama').value=p.nama;document.getElementById('fDesk').value=p.desk;document.getElementById('fHarga').value=p.harga;document.getElementById('fStok').value=p.stok;document.getElementById('fKat').value=p.kat;document.getElementById('fId').value=i;tmp=p.foto;document.getElementById('prev').src=p.foto;document.getElementById('prev').style.display='block';document.getElementById('m').classList.add('show');}
function closeM(){document.getElementById('m').classList.remove('show');}
function prev(inp){if(inp.files&&inp.files[0]){const r=new FileReader();r.onload=e=>{tmp=e.target.result;document.getElementById('prev').src=tmp;document.getElementById('prev').style.display='block';};r.readAsDataURL(inp.files[0]);}}
function save(){const nama=document.getElementById('fNama').value.trim();const desk=document.getElementById('fDesk').value.trim();const harga=document.getElementById('fHarga').value;const stok=document.getElementById('fStok').value||10;const kat=document.getElementById('fKat').value;const id=document.getElementById('fId').value;if(!nama||!harga||!tmp)return alert('Nama, Harga, Foto wajib!');const d={nama,desk,harga:Number(harga),stok,kat,foto:tmp};if(id!=='')products[Number(id)]=d;else products.unshift(d);localStorage.setItem('fb_v3',JSON.stringify(products));closeM();render();}
function del(i){if(confirm('Hapus?')){products.splice(i,1);localStorage.setItem('fb_v3',JSON.stringify(products));render();}}
render();
</script></body></html>
