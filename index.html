<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FATIR BARNIK + Galeri</title><style>:root{--g:#12372A;--l:#D9FF6B}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#F5F7EC}.top{background:var(--g);color:#fff;text-align:center;padding:8px;font-size:13px}.top b{color:var(--l)}.h{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#F5F7EC;z-index:9}.logo{display:flex;gap:10px;align-items:center}.ic{width:44px;height:44px;background:var(--g);border-radius:12px;display:grid;place-items:center;color:var(--l);font-weight:900}.cart{background:var(--g);color:#fff;border:2px solid var(--l);padding:10px 14px;border-radius:999px;font-weight:800}.hero{margin:12px 16px;background:linear-gradient(135deg,#12372A,#7A9B5A);border-radius:24px;padding:20px;color:#fff}.hero h1{font-size:28px;line-height:1}.hero span{color:var(--l)}.btn-add{margin:12px 16px;width:calc(100% - 32px);background:#111;color:var(--l);border:2px solid var(--l);padding:14px;border-radius:14px;font-weight:900}.grid{margin:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:80px}.card{background:#fff;border-radius:18px;overflow:hidden}.card img{width:100%;height:130px;object-fit:cover}.card-body{padding:10px}.name{font-weight:800;font-size:13px}.price{font-weight:900;color:var(--g);margin-top:4px}.plus{width:32px;height:32px;background:var(--g);color:var(--l);border:none;border-radius:8px;font-weight:900}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:99}.modal.show{display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px;max-height:90vh;overflow:auto}.sheet input,.sheet textarea,.sheet select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:12px;margin-top:6px}.sheet label{font-size:12px;font-weight:700;margin-top:10px;display:block}.pv{width:100%;height:180px;object-fit:cover;border-radius:12px;display:none;margin-top:8px}.save{width:100%;background:var(--g);color:var(--l);padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:12px}</style></head><body><div class="top">🌿 Belanja di <b>Toko Fatir Barnik</b></div><div class="h"><div class="logo"><div class="ic">FB</div><div><b>FATIR BARNIK</b><div style="font-size:11px;opacity:.6">Temukan kebutuhanmu</div></div></div><button class="cart" onclick="alert('Keranjang: '+cnt.innerText)">🛒 <span id="cnt">0</span></button></div><div class="hero"><div style="font-size:11px;letter-spacing:2px;color:var(--l)">SELAMAT DATANG</div><h1>Belanja pilihan,<br>lebih <span>mudah.</span></h1><p style="font-size:12px;opacity:.8;margin-top:8px">Jelajahi katalog, tambah ke keranjang, pesan via WA</p></div><button class="btn-add" onclick="openAdd()">📸 + Tambah Barang dari Galeri</button><div style="margin:0 16px"><input id="q" placeholder="Cari produk..." oninput="render()" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd"></div><div class="grid" id="list"></div><div class="modal" id="M" onclick="if(event.target==this)closeM()"><div class="sheet"><b>Tambah Barang dari Galeri</b><label>📷 Foto dari Galeri HP (Wajib)</label><input type="file" id="fF" accept="image/*" onchange="prev(this)"><img id="pv" class="pv"><label>Nama Produk</label><input id="fN" placeholder="Ember Jumbo"><label>Deskripsi</label><textarea id="fD" rows="2"></textarea><label>Harga Rp</label><input id="fH" type="number"><label>Stok</label><input id="fS" type="number" value="10"><input type="hidden" id="fI"><button class="save" onclick="save()">💾 SIMPAN KE TOKO</button><button onclick="closeM()" style="width:100%;margin-top:8px;padding:12px;border:none;background:#eee;border-radius:12px">Batal</button></div></div><script>const WA='6289682006784';let P=JSON.parse(localStorage.getItem('fb_gal')||'null');if(!P){P=[{nama:'Ember Jumbo 25L',desk:'Tebal anti pecah',harga:45000,stok:20,foto:'https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=500'},{nama:'Gayung Mandi',desk:'Lentur nyaman',harga:15000,stok:30,foto:'https://images.unsplash.com/photo-1610552059377-636bee08f4bc?w=500'}];localStorage.setItem('fb_gal',JSON.stringify(P))}let C=[];let TF='';function render(){let q=document.getElementById('q').value.toLowerCase();let L=document.getElementById('list');L.innerHTML=P.filter(p=>p.nama.toLowerCase().includes(q)).map((p,i)=>{let idx=P.indexOf(p);return `<div class=card><img src=${p.foto}><div class=card-body><div class=name>${p.nama}</div><div style="font-size:11px;opacity:.5">${p.desk}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><div class=price>Rp ${p.harga.toLocaleString('id-ID')}</div><button class=plus onclick="add(${idx})">+</button></div><div style="display:flex;gap:6px;margin-top:6px"><button onclick="edit(${idx})" style="flex:1;padding:6px;border:none;background:#e8f5e9;border-radius:6px;font-size:11px">Edit</button><button onclick="del(${idx})" style="flex:1;padding:6px;border:none;background:#ffebee;border-radius:6px;font-size:11px">Hapus</button></div></div></div>`}).join('')}function add(i){let f=C.find(c=>c.i==i);if(f)f.q++;else C.push({i,q:1});document.getElementById('cnt').innerText=C.reduce((a,b)=>a+b.q,0)}function openAdd(){document.getElementById('fN').value='';document.getElementById('fD').value='';document.getElementById('fH').value='';document.getElementById('fS').value=10;document.getElementById('fI').value='';TF='';document.getElementById('pv').style.display='none';document.getElementById('M').classList.add('show')}function closeM(){document.getElementById('M').classList.remove('show')}function prev(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{TF=e.target.result;let pv=document.getElementById('pv');pv.src=TF;pv.style.display='block'};r.readAsDataURL(f)}function save(){let n=document.getElementById('fN').value.trim();let d=document.getElementById('fD').value.trim();let h=document.getElementById('fH').value;let s=document.getElementById('fS').value||10;let id=document.getElementById('fI').value;if(!n||!h)return alert('Isi nama & harga');if(!TF)return alert('Pilih foto dari galeri dulu!');let o={nama:n,desk:d,harga:Number(h),stok:Number(s),foto:TF};if(id!=='')P[Number(id)]=o;else P.unshift(o);localStorage.setItem('fb_gal',JSON.stringify(P));closeM();render();alert('✅ Berhasil! Foto galeri masuk toko')}function edit(i){let p=P[i];document.getElementById('fN').value=p.nama;document.getElementById('fD').value=p.desk;document.getElementById('fH').value=p.harga;document.getElementById('fS').value=p.stok;document.getElementById('fI').value=i;TF=p.foto;let pv=document.getElementById('pv');pv.src=TF;pv.style.display='block';document.getElementById('M').classList.add('show')}function del(i){if(confirm('Hapus?')){P.splice(i,1);localStorage.setItem('fb_gal',JSON.stringify(P));render()}}render()</script></body></html>
