arga" class="flex-1 border rounded-xl p-3 text-xs"><select id="fk" class="flex-1 border rounded-xl p-3 text-xs"><option>Elektronik</option><option>Kamar Mandi</option><option>Barnik</option><option>Dapur</option></select></div><label class="block mt-3 border-2 border-dashed rounded-xl p-3 text-center bg-green-50"><span id="fl" class="text-xs">📷 Pilih Foto Galeri</span><input id="ff" type="file" accept="image/*" hidden onchange="pick()"><img id="fp" class="hidden w-full h-32 object-cover rounded-xl mt-2"></label><div class="flex gap-2 mt-3"><button onclick="closeM('add')" class="flex-1 bg-gray-100 py-3 rounded-full text-xs">Batal</button><button onclick="saveProd()" class="flex-1 bg-green-700 text-white py-3 rounded-full text-xs font-bold">Simpan</button></div></div></div><div id="ct" class="fixed inset-0 bg-black/50 hidden"><div class="bg-white h-full max-w-sm ml-auto flex flex-col"><div class="p-3 border-b flex justify-between"><b class="text-sm">Keranjang (<span id="b2">0</span>)</b><button onclick="closeM('ct')" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div id="cl" class="flex-1 overflow-auto p-3"></div><div class="p-3 border-t"><div class="flex justify-between font-bold text-sm"><span>Total</span><span id="tt" class="text-green-700">Rp 0</span></div><input id="cn" placeholder="Nama Anda" class="w-full border rounded-xl p-3 text-xs mt-2"><button onclick="toWA()" class="w-full bg-green-700 text-white py-3 rounded-full text-sm font-bold mt-3">Pesan WA</button></div></div></div><div id="pf" class="fixed inset-0 bg-black/50 hidden p-4"><div class="bg-white rounded-2xl max-w-sm mx-auto mt-20 p-5 text-center"><h2 class="font-bold">FATIR BARNIK</h2><div class="text-[11px] bg-gray-50 p-3 rounded-xl mt-3">📍 Kedungwaringin Bekasi<br>📞 0896-8200-6784</div><a href="https://wa.me/6289682006784" class="block bg-green-700 text-white py-3 rounded-full text-xs font-bold mt-3">Chat WA</a><button onclick="closeM('pf')" class="w-full bg-gray-100 py-2 rounded-full text-xs mt-2">Tutup</button></div></div><script>var isAdmin=localStorage.getItem('fb_admin')==='true',tmp='';function openM(i){document.getElementById(i).classList.remove('hidden')}function closeM(i){document.getElementById(i).classList.add('hidden')}function doLogin(){if(isAdmin){if(confirm('Keluar?')){isAdmin=false;localStorage.removeItem('fb_admin');upd();render();}return;}var p=prompt('PIN (6784):');if(p==='6784'||p==='1234'){isAdmin=true;localStorage.setItem('fb_admin','true');upd();render();alert('Admin OK');openM('add')}else if(p)alert('PIN salah')}function upd(){document.getElementById('ab').className=isAdmin?'bg-blue-600 text-white text-[8px] px-2 py-1 rounded-full ml-2':'hidden';document.getElementById('ba').innerText=isAdmin?'✅ Admin':'🔒 Admin'}function pick(){var f=document.getElementById('ff').files[0];if(!f)return;var r=new FileReader();r.onload=function(e){tmp=e.target.result;document.getElementById('fp').src=tmp;document.getElementById('fp').classList.remove('hidden');document.getElementById('fl').innerText='✅ Foto terpilih';};r.readAsDataURL(f);}var products=JSON.parse(localStorage.getItem('fb_f')||'null')||[{n:"Kipas Mini Karakter",h:30000,k:"Elektronik",img:""},{n:"Tempat Sabun",h:15000,k:"Kamar Mandi",img:""}];var cart=JSON.parse(localStorage.getItem('fb_c')||'[]');function saveP(){localStorage.setItem('fb_f',JSON.stringify(products))}function saveC(){localStorage.setItem('fb_c',JSON.stringify(cart))}function render(){var q=document.getElementById('s').value.toLowerCase(),kf=document.getElementById('k').value,g=document.getElementById('grid'),list=products.filter(function(p){return(!q||p.n.toLowerCase().indexOf(q)>=0)&&(kf==='all'||p.k===kf)}),html='';for(var i=0;i<list.length;i++){var p=list[i],ri=products.indexOf(p),img=p.img?'<img src="'+p.img+'" class="w-full h-32 object-cover">':'<div class="w-full h-32 bg-gray-100 flex items-center justify-center">📦</div>',del=isAdmin?'<button onclick="delP('+ri+')" class="absolute top-1 right-1 bg-red-500 text-white text-[8px] px-2 py-1 rounded-full">Hapus</button>':'';html+='<div class="bg-white border rounded-xl overflow-hidden relative"><div class="relative">'+img+del+'</div><div class="p-2"><span class="text-[8px] bg-gray-100 px-2 py-1 rounded-full">'+p.k+'</span><p class="text-xs font-semibold mt-1">'+p.n+'</p><p class="text-green-700 font-bold text-xs">Rp '+p.h.toLocaleString()+'</p><button onclick="addC('+ri+')" class="mt-2 w-full bg-black text-white py-2 rounded-full text-[10px] font-bold">+ Keranjang</button></div></div>'}g.innerHTML=html;badge()}function addC(i){var p=products[i],f=null;for(var j=0;j<cart.length;j++)if(cart[j].n===p.n)f=cart[j];if(f)f.q++;else cart.push({n:p.n,h:p.h,q:1,img:p.img});saveC();renderCart();badge();openM('ct')}function renderCart(){var l=document.getElementById('cl'),t=0,h='';for(var i=0;i<cart.length;i++){var it=cart[i];t+=it.h*it.q;h+='<div class="bg-gray-50 rounded-xl p-2 flex gap-2"><div class="w-10 h-10 bg-white rounded-lg overflow-hidden">'+(it.img?'<img src="'+it.img+'" class="w-full h-full object-cover">':'📦')+'</div><div class="flex-1"><p class="text-[11px] font-semibold">'+it.n+'</p><p class="text-[10px] text-green-700">Rp '+it.h.toLocaleString()+' x '+it.q+'</p><div class="flex gap-1 mt-1"><button onclick="chg('+i+',-1)" class="w-6 h-6 bg-white border rounded-full">-</button><span class="text-[10px]">'+it.q+'</span><button onclick="chg('+i+',1)" class="w-6 h-6 bg-white border rounded-full">+</button><button onclick="rem('+i+')" class="ml-auto text-[9px] text-red-500">Hapus</button></div></div></div>'}l.innerHTML=h||"<p class='text-center text-[11px] text-gray-400 py-10'>Kosong</p>";document.getElementById('tt').innerText='Rp '+t.toLocaleString()}function badge(){var c=0;for(var i=0;i<cart.length;i++)c+=cart[i].q;document.getElementById('b1').innerText=c;document.getElementById('b2').innerText=c}function chg(k,d){cart[k].q+=d;if(cart[k].q<=0)cart.splice(k,1);saveC();renderCart();badge()}function rem(k){cart.splice(k,1);saveC();renderCart();badge()}function saveProd(){if(!isAdmin){alert('Login Admin dulu!');return}var n=document.getElementById('fn').value.trim(),h=parseInt(document.getElementById('fh').value),k=document.getElementById('fk').value;if(!n||!h){alert('Nama & harga wajib');return}if(!tmp){alert('Pilih foto!');return}products.unshift({n:n,h:h,k:k,img:tmp});saveP();document.getElementById('fn').value='';document.getElementById('fh').value='';document.getElementById('ff').value='';document.getElementById('fp').classList.add('hidden');document.getElementById('fl').innerText='📷 Pilih Foto Galeri';tmp='';closeM('add');render();alert('Berhasil!')}function delP(i){if(!isAdmin)return;if(confirm('Hapus '+products[i].n+'?')){products.splice(i,1);saveP();render()}}function toWA(){if(!cart.length){alert('Kosong');return}var nm=document.getElementById('cn').value.trim();if(!nm){alert('Isi nama');return}var t=0;for(var i=0;i<cart.length;i++)t+=cart[i].h*cart[i].q;var it='';for(var i=0;i<cart.length;i++)it+='- '+cart[i].n+' x'+cart[i].q+'%0A';window.open('https://wa.me/6289682006784?text=Halo FATIR BARNIK!%0ANama: '+nm+'%0APesanan:%0A'+it+'Total: Rp '+t.toLocaleString(),' _blank')}upd();render();renderCart();</script></body></html>
