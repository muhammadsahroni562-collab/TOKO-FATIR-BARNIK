<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toko Fatir Barnik</title><style>body{font-family:system-ui;background:#F6F8FF;margin:0}.h{background:#0B5ED7;color:#fff;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.card{background:#fff;margin:8px;border-radius:12px;overflow:hidden;border:1px solid #ddd}.card img{width:100%;height:130px;object-fit:cover}.b{padding:8px}button{background:#0B5ED7;color:#fff;border:none;padding:8px;border-radius:8px;width:100%;font-weight:800;margin-top:4px}#cart{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;border-radius:16px 16px 0 0;display:none;max-height:80vh;overflow:auto;box-shadow:0 -10px 20px rgba(0,0,0,.2);z-index:20}#cart.show{display:block}</style></head><body>
<div class="h"><b>Toko Fatir Barnik</b><div><button onclick="document.getElementById('cart').classList.toggle('show')" style="width:auto;padding:6px 12px;background:#fff;color:#0B5ED7">🛒 <span id="cnt">0</span></button> <button onclick="document.getElementById('adm').style.display='block'" style="width:auto;padding:6px 12px;background:#FFD;color:#000">⚙️ Admin</button></div></div>
<div id="grid" style="display:grid;grid-template-columns:1fr 1fr"></div>
<div id="cart"><h3>Keranjang <button onclick="document.getElementById('cart').classList.remove('show')" style="float:right;width:auto;background:#eee;color:#000">X</button></h3><div id="cList"></div><button onclick="checkout()" style="margin-top:8px">Checkout WA 089682006784</button></div>
<div id="adm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);padding:20px;z-index:30"><div style="background:#fff;padding:14px;border-radius:12px"><h3>Tambah Barang Galeri</h3><input type="file" accept="image/*" id="ff"><input id="fn" placeholder="Nama: Ember Jumbo" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:8px"><input id="fh" type="number" placeholder="Harga: 50000" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:8px"><button onclick="addP()" style="margin-top:8px">💾 Simpan ke Toko</button><button onclick="document.getElementById('adm').style.display='none'" style="background:#eee;color:#000;margin-top:6px">Tutup</button></div></div>
<script>
let P=JSON.parse(localStorage.getItem('fatir')||'[]');if(P.length==0){P=[{n:'Ember Jumbo',h:50000,f:'https://images.unsplash.com/photo-1584305575477-0f38d84138a0?w=400'},{n:'Sapu Lidi',h:25000,f:'https://images.unsplash.com/photo-1585237672814-8f85a8118bf6?w=400'},{n:'Botol Minum',h:15000,f:'https://images.unsplash.com/photo-1523369364227-2498f2d03a03?w=400'}];}
let C=[],TF='';document.getElementById('ff').onchange=e=>{let r=new FileReader();r.onload=x=>TF=x.target.result;r.readAsDataURL(e.target.files[0])};
function render(){document.getElementById('grid').innerHTML=P.map((p,i)=>`<div class=card><img src="${p.f}"><div class=b><b>${p.n}</b><br>Rp ${p.h.toLocaleString()}<button onclick="add(${i})">🛒 Tambah</button></div></div>`).join('');}
function add(i){let f=C.find(x=>x.i==i);if(f)f.q++;else C.push({i,q:1});up()}
function up(){document.getElementById('cnt').innerText=C.reduce((a,b)=>a+b.q,0);document.getElementById('cList').innerHTML=C.map(c=>P[c.i].n+' x'+c.q+' = Rp '+(P[c.i].h*c.q).toLocaleString()).join('<br>')||'Kosong';}
function addP(){let n=document.getElementById('fn').value;let h=document.getElementById('fh').value;if(!n||!h||!TF)return alert('Isi foto, nama, harga dulu');P.unshift({n,h,f:TF});localStorage.setItem('fatir',JSON.stringify(P));TF='';render();alert('Berhasil masuk toko!');document.getElementById('adm').style.display='none';}
function checkout(){if(C.length==0)return alert('Keranjang kosong');let t=C.reduce((s,c)=>s+P[c.i].h*c.q,0);let m=C.map(c=>P[c.i].n+' x'+c.q).join('%0A');window.open('https://wa.me/6289682006784?text=Halo saya pesan:%0A'+m+'%0ATotal Rp '+t,'_blank');}
render();
</script></body></html>
