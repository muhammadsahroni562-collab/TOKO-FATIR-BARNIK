<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FATIR BARNIK - Toko Lengkap</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.no-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#f8faf8] text-gray-800">
<!-- HEADER -->
<header class="bg-white border-b sticky top-0 z-40">
<div class="max-w-6xl mx-auto px-3 py-3 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-9 h-9 bg-green-700 rounded-xl flex items-center justify-center text-white font-black">FB</div><div><b class="text-sm text-green-800 block leading-none">FATIR BARNIK</b><span class="text-[10px] text-gray-500">Kedungwaringin • 0896-8200-6784</span></div><span id="adminBadge" class="hidden bg-blue-600 text-white text-[9px] px-2 py-0.5 rounded-full ml-1">ADMIN</span></div>
<div class="flex items-center gap-1.5">
<button onclick="switchView('home')" class="px-3 py-2 bg-gray-100 rounded-full text-xs">🏠</button>
<button id="adminBtn" onclick="adminLogin()" class="px-3 py-2 bg-black text-white rounded-full text-xs">🔒 Admin</button>
<button onclick="openCart()" class="px-3 py-2 bg-green-700 text-white rounded-full text-xs font-bold">🛒 <span id="cartCount">0</span></button>
</div>
</div>
<div class="max-w-6xl mx-auto px-3 pb-3 flex gap-2">
<input id="q" oninput="render()" placeholder="🔍 Cari kipas, tempat sabun..." class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-xs outline-none">
<select id="cat" onchange="render()" class="bg-gray-100 rounded-full px-3 py-2.5 text-xs outline-none"><option value="all">Semua Kategori</option><option value="Barnik">Barnik</option><option value="Elektronik">Elektronik</option><option value="Kamar Mandi">Kamar Mandi</option><option value="Dapur">Dapur</option><option value="Lainnya">Lainnya</option></select>
<select id="sort" onchange="render()" class="bg-gray-100 rounded-full px-3 py-2.5 text-xs outline-none"><option value="new">Terbaru</option><option value="cheap">Harga Murah</option><option value="exp">Harga Mahal</option></select>
</div>
</header>

<main class="max-w-6xl mx-auto">
<!-- HOME BANNER -->
<div id="homeView">
<div class="m-3 bg-gradient-to-br from-green-700 to-green-600 rounded-[24px] p-5 text-white flex justify-between items-center">
<div><h1 class="text-xl font-black leading-tight">FATIR BARNIK<br>Peralatan Rumah Tangga</h1><p class="text-[11px] mt-1 opacity-90">Stok Real • Harga Grosir • WA: 0896-8200-6784</p><div class="flex gap-2 mt-3"><span class="bg-white/20 px-2 py-1 rounded-full text-[10px]">📦 Bisa COD</span><span class="bg-white/20 px-2 py-1 rounded-full text-[10px]">⚡ Respon Cepat</span></div></div>
<button id="addProductBtn" onclick="openModal('addModal')" class="hidden bg-white text-green-700 px-4 py-2.5 rounded-full text-xs font-bold shadow">+ Tambah Produk</button>
</div>
<div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3 p-3"></div>
</div>

<!-- ADMIN VIEW -->
<div id="adminView" class="hidden p-3">
<div class="flex gap-2 mb-3"><button onclick="adminTab('products')" id="tabProd" class="flex-1 bg-black text-white py-3 rounded-full text-xs font-bold">⚙️ Produk & Stok</button><button onclick="adminTab('orders')" id="tabOrd" class="flex-1 bg-gray-100 py-3 rounded-full text-xs font-bold">📋 Daftar Pesanan (<span id="orderCount">0</span>)</button></div>
<div id="adminProducts" class="bg-white rounded-2xl border overflow-hidden"><div class="p-3 border-b flex justify-between items-center"><b class="text-sm">Kelola Produk, Harga & Stok</b><button onclick="openModal('addModal')" class="bg-green-700 text-white px-3 py-1.5 rounded-full text-xs">+ Produk</button></div><div id="adminProductList" class="divide-y"></div></div>
<div id="adminOrders" class="hidden bg-white rounded-2xl border overflow-hidden"><div class="p-3 border-b"><b class="text-sm">Daftar Pesanan Masuk</b><p class="text-[10px] text-gray-500">Ubah status setelah proses WA</p></div><div id="orderList" class="divide-y"></div></div>
</div>
</main>

<!-- CART -->
<div id="cartModal" class="fixed inset-0 bg-black/50 hidden z-50"><div class="bg-white h-full max-w-sm ml-auto flex flex-col"><div class="p-4 border-b flex justify-between items-center"><b class="text-sm">Keranjang • <span id="cartCount2">0</span> item</b><button onclick="closeModal('cartModal')" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div id="cartItems" class="flex-1 overflow-auto p-3"></div><div class="p-4 border-t bg-gray-50"><div class="space-y-2 mb-3"><input id="custName" placeholder="Nama Pembeli *" class="w-full border rounded-xl p-3 text-xs"><input id="custWA" placeholder="No WA Pembeli (08
