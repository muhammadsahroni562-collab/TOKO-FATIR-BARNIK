<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FATIR BARNIK</title>
<style>body{margin:0;font-family:system-ui;background:#f6f3ee;color:#111}.top{ background:#12372a;color:#cde6d0;text-align:center;padding:8px;font-size:13px}.top b{color:#d9ff6a}.hdr{position:sticky;top:0;z-index:9;background:rgba(246,243,238,.95);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}.logo{display:flex;gap:10px;align-items:center}.ic{width:44px;height:44px;border-radius:14px;background:#12372a;display:grid;place-items:center;color:#d9ff6a;font-weight:900;font-size:22px}.searchW{padding:10px 16px}.searchW div{width:100%;padding:14px 18px;border-radius:16px;border:1px solid #ddd;background:#ece9e3;display:flex}.searchW input{flex:1;border:0;background:transparent;outline:none}.hero{margin:16px;border-radius:28px;background:linear-gradient(135deg,#12372a,#1e5a42);color:white;padding:28px}.hero h1{font-size:32px;line-height:1.1}.hero span{color:#d9ff6a}.btnL{margin-top:14px;background:#d9ff6a;color:#12372a;border:0;padding:12px 18px;border-radius:14px;font-weight:800}.admin{margin:16px;padding:12px;background:#12372a;border-radius:14px;display:flex;gap:10px}.admin button{flex:1;padding:14px;border-radius:12px;border:0;font-weight:900}.g{background:#d9ff6a;color:#12372a}.r{background:#ffffff22;color:white;border:1px solid #fff3 !important}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}.mc{background:white;border-radius:14px;padding:10px;display:flex;gap:8px;border:1px solid #eee}.prodG{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.prod{background:white;border-radius:18px;overflow:hidden;border:1px solid #eee}.pImg{aspect-ratio:1;background:#f1f0e8;display:grid;place-items:center;font-size:50px;position:relative}.pImg img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:8px;left:8px;background:#d9ff6a;color:#12372a;font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px}.pBody{padding:10px}.cat{font-size:10px;color:#1a4d3a;font-weight:800;letter-spacing:.1em}.priceRow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.add{width:32px;height:32px;border-radius:999px;border:0;background:#12372a;color:white}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:100;padding:16px}.modal.open{display:grid}.box{background:white;border-radius:18px;width:100%;max-width:400px;padding:18px}.field{margin-bottom:10px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd}.prev{width:100%;height:160px;object-fit:cover;border-radius:10px;display:none;margin-bottom:8px}.cartD{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:90}.cartD.open{display:block}.cartB{position:absolute;right:0;top:0;bottom:0;width:88%;max-width:360px;background:white;padding:16px;display:flex;flex-direction:column}</style></head><body>
<div class="top">Belanja nyaman di <b>Toko Fatir Barnik</b></div>
<div class="hdr"><div class="logo"><div class="ic">FB</div><div><b>FATIR BARNIK</b><br><small style="color:#888">Temukan kebutuhanmu</small></div></div><button onclick="openCart()" style="background:#12372a;color:white;border:0;padding:10px 14px;border-radius:999px;font-weight:800">Keranjang <span id="cartCount" style="background:#d9ff6a;color:#12372a;padding:2px 7px;border-radius:999px">0</span></button></div>
<div class="searchW"><div><input id="searchInput" placeholder="Cari produk..." oninput="render()"><span>⌕</span></div></div>
<div class="admin"><button class="g" onclick="openAdd()">📸 + TAMBAH DARI GALERI</button><button class="r" onclick="clearCustom()">Reset</button></div>
<div class="hero"><div style="color:#d9ff6a;font-size:11px;letter-spacing:.2em;font-weight:800">SELAMAT DATANG</div><h1>Belanja pilihan,<br>lebih <span>mudah.</span></h1><p style="margin-top:10px;color:#d6e8d8;line-height:1.5">Jelajahi katalog, masukkan ke keranjang, lalu pesan dengan praktis.</p><button class="btnL" onclick="document.getElementById('produk').scrollIntoView({behavior:'smooth'})">Mulai Belanja</button></div>
<div class="grid2"><div class="mc">📦 Produk beragam</div><div class="mc">💬 Pesan via WA</div></div>
<div style="padding:18px 16px" id="produk"><h2>Produk pilihan ✨</h2><p style="color:#888;font-size:13px"><span id="totalCount"></span> produk</p><div style="display:flex;gap:8px;overflow:auto;margin-top:10px" id="pillRow"></div><div class="prodG" id="productGrid"></div></div>
<div class="modal" id="addModal"><div class="box"><h2>Tambah Produk Galeri</h2><img id="preview" class="prev"><div class="field"><label>Foto dari Galeri HP (wajib)</label><input type="file" id="fileInput" accept="image/*" onchange="handleFile(this)"><small id="fileStatus" style="color:green"></small></div><div class="field"><label>Nama Produk</label><input id="pName" placeholder="Ember biru besar"></div><div class="field"><label>Harga Rp</label><input id="pPrice" type="number" placeholder="25000"></div><div class="field"><label>Kategori</label><select id="pCat"><option>Kebutuhan harian</option><option>Perlengkapan</option><option>Dapur</option><option>Kamar mandi</option></select></div><div class="field"><label>Stok</label><input id="pStock" type="number" value="10"></div><div class="field"><label>Deskripsi</label><textarea id="pDesc" rows="2"></textarea></div><div style="display:flex;gap:10px"><button onclick="closeAdd()" style="flex:1;padding:12px;border-radius:10px;border:1px solid #ddd;background:white">Batal</button><button onclick="saveProduct()" style="flex:1;padding:12px;border-radius:10px;border:0;background:#12372a;color:white;font-weight:800">Simpan</button></div></div></div>
<div class="cartD" id="cartDrawer" onclick="if(event.target==this)closeCart()"><div class="cartB"><div style="display:flex;justify-content:space-between"><h2>Keranjang</h2><button onclick="closeCart()" style="border:0;background:#eee;border-radius:999px;width:28px;height:28px">✕</button></div><div id="cartList" style="flex:1;overflow:auto;margin-top:12px"></div><div style="border-top:1px solid #eee;padding-top:10px"><div style="display:flex;justify-content:space-between;font-weight:900"><span>Total</span><span id="cartTotal">Rp 0</span></div><button onclick="checkoutWA()" style="width:100%;margin-top:10px;padding:12px;border-radius:10px;border:0;background:#d9ff6a;font-weight:900">Pesan via WhatsApp</button></div></div></div>
<script>
const defaultProducts=[{id:1,name:'Paket kebutuhan harian',price:25000,cat:'Kebutuhan harian',stock:20,desc:'Paket praktis.',emoji:'🧺',badge:'Pilihan'},{id:2,name:'Botol minum serbaguna',price:18000,cat:'Perlengkapan',stock:15,desc:'Teman aktivitas.',emoji:'🧴',badge:'Favorit'},{id:3,name:'Ember Besar',price:35000,cat:'Kamar mandi',stock:12,desc:'Ember kuat.',emoji:'🪣',badge:'Best'},{id:4,name:'Gayung Mandi',price:12000,cat:'Kamar mandi',stock:30,desc:'Gayung tebal.',emoji:'🫧',badge:'Murah'}];
let customProducts=JSON.parse(localStorage.getItem('fatir_custom')||'[]');
let products=[...defaultProducts,...customProducts];
let categories=['Semua',...new Set(products.map(p=>p.cat))];
let activeCat='Semua';let cart=JSON.parse(localStorage.getItem('fatir_cart')||'[]');let tempImage='';
function renderPills(){document.getElementById('pillRow').innerHTML=categories.map(c=>`<button onclick="setCat('${c}')" style="white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid #ddd;background:${c===activeCat?'#12372a':'white'};color:${c===activeCat?'white':'#111'};font-weight:700">${c}</button>`).join('')}
function setCat(c){activeCat=c;renderPills();render()}
function render(){const q=(document.getElementById('searchInput').value||'').toLowerCase();let list=products.filter(p=>{const mc=activeCat==='Semua'||p.cat===activeCat;const mq=!q||p.name.toLowerCase().includes(q);return mc&&mq});document.getElementById('totalCount').textContent=list.length;document.getElementById('productGrid').innerHTML=list.map(p=>`<div class="prod"><div class="pImg">${p.image?`<img src="${p.image}">`:`<span>${p.emoji}</span>`}<span class="badge">${p.badge||'Produk'}</span></div><div class="pBody"><div class="cat">${p.cat.toUpperCase()}</div><div style="font-weight:700;margin:4px 0">${p.name}</div><div style="font-size:11px;color:#888">${p.desc}</div><div class="priceRow"><div><b>Rp ${p.price.toLocaleString('id-ID')}</b><br><small style="color:#888">Stok:${p.stock}</small></div><button class="add" onclick="addToCart(${p.id})">+</button></div></div></div>`).join('');updateCount()}
function addToCart(id){let it=cart.find(c=>c.id===id);if(it)it.qty++;else cart.push({id,qty:1});localStorage.setItem('fatir_cart',JSON.stringify(cart));renderCart();updateCount();openCart()}
function updateCount(){document.getElementById('cartCount').textContent=cart.reduce((s,c)=>s+c.qty,0)}
function openCart(){document.getElementById('cartDrawer').classList.add('open');renderCart()}function closeCart(){document.getElementById('cartDrawer').classList.remove('open')}
function renderCart(){let h='';let t=0;cart.forEach(c=>{let p=products.find(pr=>pr.id===c.id);if(!p)return;let sub=p.price*c.qty;t+=sub;h+=`<div style="display:flex;gap:10px;margin-bottom:10px"><div style="width:44px;height:44px;background:#f0f0f0;border-radius:8px;display:grid;place-items:center">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`:p.emoji}</div><div style="flex:1"><b style="font-size:13px">${p.name}</b><br><small>Rp ${p.price.toLocaleString('id-ID')} x ${c.qty}</small></div><button onclick="removeCart(${c.id})" style="border:0;background:#fee;border-radius:6px;padding:2px 6px">✕</button></div>`});document.getElementById('cartList').innerHTML=h||'<p style="color:#888;text-align:center;margin-top:30px">Kosong</p>';document.getElementById('cartTotal').textContent='Rp '+t.toLocaleString('id-ID')}
function removeCart(id){cart=cart.filter(c=>c.id!==id);localStorage.setItem('fatir_cart',JSON.stringify(cart));renderCart();updateCount()}
function checkoutWA(){if(!cart.length)return alert('Kosong');let total=0;let msg='Halo Toko Fatir Barnik, mau pesan:%0A';cart.forEach(c=>{let p=products.find(pr=>pr.id===c.id);if(!p)return;total+=p.price*c.qty;msg+=`- ${p.name} x ${c.qty}%0A`});msg+=`Total Rp ${total.toLocaleString('id-ID')}`;window.open('https://wa.me/6289682006784?text='+msg,'_blank')}
function openAdd(){document.getElementById('addModal').classList.add('open')}function closeAdd(){document.getElementById('addModal').classList.remove('open');document.getElementById('preview').style.display='none';tempImage=''}
function handleFile(inp){if(inp.files&&inp.files[0]){let r=new FileReader();r.onload=e=>{tempImage=e.target.result;let img=document.getElementById('preview');img.src=tempImage;img.style.display='block';document.getElementById('fileStatus').textContent='Foto siap!'};r.readAsDataURL(inp.files[0])}}
function saveProduct(){const name=document.getElementById('pName').value.trim();const price=parseInt(document.getElementById('pPrice').value);const cat=document.getElementById('pCat').value;const stock=parseInt(document.getElementById('pStock').value)||10;const desc=document.getElementById('pDesc').value||'Produk galeri';if(!tempImage)return alert('Pilih foto dari galeri!');if(!name)return alert('Nama wajib!');if(!price)return alert('Harga wajib!');const np={id:Date.now(),name,price,cat,stock,desc,image:tempImage,badge:'Baru',emoji:'📦'};customProducts.push(np);localStorage.setItem('fatir_custom',JSON.stringify(customProducts));products=[...defaultProducts,...customProducts];categories=['Semua',...new Set(products.map(p=>p.cat))];renderPills();render();closeAdd();alert('Berhasil! Produk muncul di bawah.')}
function clearCustom(){if(confirm('Hapus produk galeri?')){localStorage.removeItem('fatir_custom');customProducts=[];products=[...defaultProducts];categories=['Semua',...new Set(products.map(p=>p.cat))];renderPills();render()}}
renderPills();render();updateCount();
</script></body></html>
