<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toko Fatir Barnik</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50"><header class="bg-white p-4 flex justify-between items-center sticky top-0 z-20 border-b"><div class="flex gap-2 items-center"><div class="w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center text-white font-bold">F</div><b class="text-green-700">FATIR BARNIK</b></div><div class="flex gap-2"><button onclick="document.getElementById('admin').classList.remove('hidden')" class="w-8 h-8 bg-gray-100 rounded-full">⚙️</button><button onclick="document.getElementById('cart').classList.remove('hidden')" class="bg-green-600 text-white px-3 py-1.5 rounded-full text-sm font-bold">🛒 <span id="c1">0</span></button></div></header><div class="p-4"><input id="search" oninput="render()" placeholder="Cari barnik, plastik..." class="w-full bg-white border rounded-full px-4 py-2.5 text-sm"></div><div class="px-4 flex gap-2 overflow-auto pb-2"><button onclick="setK('semua')" id="ksemua" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs">Semua</button><button onclick="setK('barnik')" id="kbarnik" class="bg-white border px-4 py-2 rounded-full text-xs">Barnik</button><button onclick="setK('plastik')" id="kplastik" class="bg-white border px-4 py-2 rounded-full text-xs">Plastik</button><button onclick="setK('kresek')" id="kkresek" class="bg-white border px-4 py-2 rounded-full text-xs">Kresek</button><button onclick="setK('karung')" id="kkarung" class="bg-white border px-4 py-2 rounded-full text-xs">Karung</button></div><div id="grid" class="p-4 grid grid-cols-2 gap-3 max-w-6xl mx-auto"></div><div id="cart" class="fixed inset-0 bg-black/50 hidden z-50"><div class="bg-white h-full max-w-md ml-auto flex flex-col"><div class="p-4 border-b flex justify-between"><b>Keranjang (<span id="c2">0</span>)</b><button onclick="document.getElementById('cart').classList.add('hidden')">X</button></div><div id="list" class="flex-1 overflow-auto p-4 space-y-2"></div><div class="p-4 border-t bg-gray-50"><input id="nama" placeholder="Nama Anda" class="w-full border rounded-xl p-3 text-sm mb-2"><div class="flex justify-between font-bold mb-3"><span>Total</span><span id="total" class="text-green-600">Rp 0</span></div><button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-full font-bold text-sm">Pesan via WA</button></div></div></div><div id="admin" class="fixed inset-0 bg-black/50 hidden z-50 p-4 overflow-auto"><div class="bg-white max-w-md mx-auto rounded-2xl p-5 mt-6"><div class="flex justify-between mb-3"><b>Admin PIN:1234</b><button onclick="document.getElementById('admin').classList.add('hidden')">X</button></div><input id="pin" type="password" placeholder="PIN" class="w-full border rounded-xl p-3 text-sm mb-2"><button id="btnPin" onclick="if(document.getElementById('pin').value=='1234'){document.getElementById('form').classList.remove('hidden');this.style.display='none'}else alert('PIN salah')" class="w-full bg-black text-white py-2 rounded-full text-sm mb-3">Buka Panel</button><div id="form" class="hidden"><div class="bg-green-50 border border-green-200 p-3 rounded-xl text-xs mb-3">✨ CARA TAMBAH DARI GALERI:<br>1. Klik Pilih File di bawah<br>2. Pilih foto barnik dari galeri<br>3. Isi nama & harga<br>4. Klik Tambah</div><div class="bg-gray-50 p-3 rounded-xl space-y-2 mb-3"><label class="text-xs font-bold">📸 FOTO DARI GALERI HP:</label><input id="pfile" type="file" accept="image/*" class="w-full text-xs bg-white p-2 border rounded-lg"><img id="preview" class="hidden w-full h-32 object-contain bg-white rounded-lg mt-2 border"><input id="pn" placeholder="Nama produk cth: Barnik Merah Jumbo Asli" class="w-full border rounded-lg p-2.5 text-sm"><input id="ph" type="number" placeholder="Harga cth: 8000" class="w-full border rounded-lg p-2.5 text-sm"><select id="pk" class="w-full border rounded-lg p-2.5 text-sm"><option value="barnik">Barnik</option><option value="plastik">Plastik</option><option value="kresek">Kresek</option><option value="karung">Karung</option><option value="lain">Lain</option></select><button onclick="add()" class="w-full bg-green-600 text-white py-2.5 rounded-full text-sm font-bold">+ Tambah Produk dengan Foto</button></div><div id="alist" class="space-y-2 max-h-96 overflow-auto"></div></div></div></div><script>
let defs=[{id:1,nama:"Barnik Merah Jumbo",harga:8000,kat:"barnik",img:"🧺"},{id:2,nama:"Barnik Putih Sedang",harga:6000,kat:"barnik",img:"🧺"},{id:3,nama:"Plastik Bening 1kg",harga:18000,kat:"plastik",img:"📦"}];
let produk=JSON.parse(localStorage.getItem('fb_p')||'null')||defs;let cart=JSON.parse(localStorage.getItem('fb_c')||'[]');let kat='semua';let tempImg='';
document.getElementById('pfile').addEventListener('change',function(e){let f=e.target.files[0];if(!f)return;if(f.size>800000){alert('Foto terlalu besar, pilih foto < 800KB atau crop dulu');return}let r=new FileReader();r.onload=function(ev){tempImg=ev.target.result;let pv=document.getElementById('preview');pv.src=tempImg;pv.classList.remove('hidden')};r.readAsDataURL(f)});
function save(){localStorage.setItem('fb_p',JSON.stringify(produk));localStorage.setItem('fb_c',JSON.stringify(cart))}
function rp(n){return 'Rp '+n.toLocaleString('id-ID')}
function setK(k){kat=k;document.querySelectorAll('[id^=k]').forEach(b=>b.className='bg-white border px-4 py-2 rounded-full text-xs');document.getElementById('k'+k).className='bg-green-600 text-white px-4 py-2 rounded-full text-xs';render()}
function render(){let g=document.getElementById('grid');g.innerHTML='';let q=document.getElementById('search').value.toLowerCase();produk.filter(p=>(kat=='semua'||p.kat==kat)&&p.nama.toLowerCase().includes(q)).forEach(p=>{let im=(p.img&&p.img.startsWith('data:'))?`<img src="${p.img}" class="h-24 w-full object-contain">`:p.img.startsWith('http')?`<img src="${p.img}" class="h-20 object-contain">`:`<div class="text-4xl">${p.img}</div>`;g.innerHTML+=`<div class="bg-white rounded-xl border p-3 flex flex-col"><div class="bg-gray-50 rounded-lg h-28 flex items-center justify-center overflow-hidden">${im}</div><p class="text-[10px] bg-green-50 text-green-700 px-2 py-0.5 rounded-full inline mt-2 w-fit">${p.kat}</p><p class="font-semibold text-xs mt-1">${p.nama}</p><p class="font-bold text-green-600 text-sm">${rp(p.harga)}</p><button onclick="addC(${p.id})" class="mt-2 w-full bg-gray-900 text-white py-2 rounded-full text-xs">+ Keranjang</button></div>`})}
function addC(id){let p=produk.find(x=>x.id==id);let c=cart.find(x=>x.id==id);if(c)c.qty++;else cart.push({...p,qty:1});save();up();document.getElementById('cart').classList.remove('hidden')}
function up(){let co=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('c1').innerText=co;document.getElementById('c2').innerText=co;let t=0,h='';cart.forEach((it,i)=>{t+=it.harga*it.qty;h+=`<div class="bg-gray-50 p-3 rounded-xl flex justify-between"><div class="flex gap-2"><div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center overflow-hidden">${it.img.startsWith('data:')||it.img.startsWith('http')?`<img src="${it.img}" class="w-full h-full object-contain">`:`<span>${it.img}</span>`}</div><div><p class="text-sm font-semibold">${it.nama}</p><p class="text-xs">${rp(it.harga)} x ${it.qty}</p><div class="flex gap-2 mt-1"><button onclick="ch(${i},-1)" class="w-6 h-6 bg-white border rounded-full">-</button><span class="text-sm">${it.qty}</span><button onclick="ch(${i},1)" class="w-6 h-6 bg-white border rounded-full">+</button></div></div></div><button onclick="rm(${i})" class="text-red-500 text-xs">Hapus</button></div>`});document.getElementById('list').innerHTML=h||'<p class="text-center text-gray-400 mt-20">Kosong</p>';document.getElementById('total').innerText=rp(t)}
function ch(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();up()}
function rm(i){cart.splice(i,1);save();up()}
function add(){let n=document.getElementById('pn').value;let h=parseInt(document.getElementById('ph').value);let k=document.getElementById('pk').value;let im=tempImg||'📦';if(!n||!h)return alert('Isi nama & harga + pilih foto dulu!');if(!tempImg)return alert('Pilih foto dari galeri dulu! Klik Pilih File');produk.unshift({id:Date.now(),nama:n,harga:h,kat:k,img:im});save();render();rA();document.getElementById('pn').value='';document.getElementById('ph').value='';document.getElementById('pfile').value='';document.getElementById('preview').classList.add('hidden');tempImg='';alert('Berhasil! Produk dengan foto galeri sudah ditambah!')}
function del(id){if(confirm('Hapus produk ini?')){produk=produk.filter(p=>p.id!=id);save();render();rA()}}
function rA(){document.getElementById('alist').innerHTML=produk.map(p=>`<div class="flex gap-2 items-center border p-2 rounded-xl text-xs"><div class="w-10 h-10 bg-gray-50 rounded-lg flex items-center justify-center overflow-hidden">${p.img.startsWith('data:')||p.img.startsWith('http')?`<img src="${p.img}" class="w-full h-full object-contain">`:`<span>${p.img}</span>`}</div><div class="flex-1"><b>${p.nama}</b><br>${p.kat} • ${rp(p.harga)}</div><button onclick="del(${p.id})" class="text-red-500 bg-red-50 px-3 py-1 rounded-full">Hapus</button></div>`).join('')}
function checkout(){if(!cart.length)return alert('Kosong');let nm=document.getElementById('nama').value||'Pelanggan';let tot=cart.reduce((a,b)=>a+b.harga*b.qty,0);let msg=`Halo Toko Fatir Barnik! Saya ${nm} mau pesan:%0A`+cart.map(c=>`- ${c.nama} x${c.qty} = ${rp(c.harga*c.qty)}`).join('%0A')+`%0A%0ATotal ${rp(tot)}`;window.open('https://wa.me/6289682006784?text='+msg,'_blank')}
render();up();rA();
</script></body></html>
