<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKO FATIR BARNIK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f3f5ef;padding:12px}
.header{background:#12372a;color:#d9ff6a;padding:16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center}
.btn-add{background:#d9ff6a;color:#12372a;border:none;padding:14px 18px;border-radius:12px;font-weight:900;font-size:16px;width:100%;margin:12px 0}
.btn-add-big{background:#111;color:white;border:2px solid #d9ff6a;padding:20px;border-radius:18px;font-weight:900;font-size:20px;width:100%;margin:16px 0;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:140px;object-fit:cover}
.card-body{padding:10px}
.price{color:#12372a;font-weight:900}
.actions{display:flex;gap:6px;margin-top:8px}
.actions button{flex:1;padding:8px;border:none;border-radius:8px;font-weight:700}
.edit{background:#e8f5e9;color:#12372a}
.del{background:#ffebee;color:#b71c1c}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.show{display:flex}
.box{background:white;width:100%;max-width:400px;border-radius:20px;padding:18px;max-height:90vh;overflow:auto}
.box input,.box textarea,.box select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:6px 0;font-size:16px}
.box label{font-weight:700;font-size:13px;margin-top:8px;display:block}
.preview{width:100%;height:180px;background:#eee;border-radius:12px;object-fit:cover;display:none;margin:8px 0}
.save{background:#12372a;color:#d9ff6a;border:none;padding:14px;width:100%;border-radius:12px;font-weight:900;font-size:18px;margin-top:10px}
</style>
</head>
<body>

<div class="header">
<b>FATIR BARNIK</b>
<span id="count">0 Produk</span>
</div>

<button class="btn-add-big" onclick="openAdd()">➕ TAMBAH PRODUK<br><small style="font-size:13px">📸 Upload dari Galeri HP</small></button>

<div id="list" class="grid"></div>

<div id="modal" class="modal" onclick="if(event.target==this)closeM()">
<div class="box">
<h3 id="mtitle">Tambah Produk</h3>
<label>📸 Foto Produk (dari Galeri HP)</label>
<input type="file" id="foto" accept="image/*" onchange="prev(this)">
<img id="preview" class="preview">
<label>📝 Nama Produk</label>
<input id="nama" placeholder="Contoh: Ember Besar Biru">
<label>📝 Deskripsi</label>
<textarea id="desk" placeholder="Deskripsi singkat produk" rows="3"></textarea>
<label>💰 Harga</label>
<input id="harga" type="number" placeholder="35000">
<label>📦 Stok</label>
<input id="stok" type="number" placeholder="10">
<input type="hidden" id="editId">
<button class="save" onclick="simpan()">💾 SIMPAN PRODUK</button>
<button onclick="closeM()" style="width:100%;margin-top:8px;padding:10px;border:none;background:#eee;border-radius:10px">Batal</button>
</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('fatir_products')||'[]');
let tempImg = '';

function render(){
  const c=document.getElementById('list');
  document.getElementById('count').innerText=products.length+' Produk';
  if(products.length==0){
    c.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;background:white;border-radius:16px">Belum ada produk<br>Klik tombol TAMBAH PRODUK di atas</div>'; return;
  }
  c.innerHTML=products.map((p,i)=>`
    <div class="card">
      <img src="${p.foto}">
      <div class="card-body">
        <b>${p.nama}</b><br>
        <small>${p.desk||''}</small><br>
        <div class="price">Rp ${Number(p.harga).toLocaleString('id-ID')}</div>
        <small>Stok: ${p.stok}</small>
        <div class="actions">
          <button class="edit" onclick="editP(${i})">✏️ Edit</button>
          <button class="del" onclick="hapus(${i})">🗑️ Hapus</button>
        </div>
      </div>
    </div>`).join('');
}

function openAdd(){
  document.getElementById('mtitle').innerText='➕ Tambah Produk';
  document.getElementById('nama').value='';document.getElementById('desk').value='';document.getElementById('harga').value='';document.getElementById('stok').value='';document.getElementById('editId').value='';tempImg='';document.getElementById('preview').style.display='none';
  document.getElementById('modal').classList.add('show');
}
function editP(i){
  const p=products[i];
  document.getElementById('mtitle').innerText='✏️ Edit Produk';
  document.getElementById('nama').value=p.nama;document.getElementById('desk').value=p.desk;document.getElementById('harga').value=p.harga;document.getElementById('stok').value=p.stok;document.getElementById('editId').value=i;tempImg=p.foto;
  document.getElementById('preview').src=p.foto;document.getElementById('preview').style.display='block';
  document.getElementById('modal').classList.add('show');
}
function closeM(){document.getElementById('modal').classList.remove('show');}
function prev(input){
  if(input.files&&input.files[0]){
    const r=new FileReader();r.onload=e=>{tempImg=e.target.result;document.getElementById('preview').src=tempImg;document.getElementById('preview').style.display='block';};r.readAsDataURL(input.files[0]);
  }
}
function simpan(){
  const nama=document.getElementById('nama').value.trim();
  const desk=document.getElementById('desk').value.trim();
  const harga=document.getElementById('harga').value;
  const stok=document.getElementById('stok').value;
  const editId=document.getElementById('editId').value;
  if(!nama||!harga||!tempImg){alert('Lengkapi Nama, Harga, dan Foto!');return;}
  const data={nama,desk,harga,stok:stok||'10',foto:tempImg};
  if(editId!==''){products[Number(editId)]=data;}else{products.unshift(data);}
  localStorage.setItem('fatir_products',JSON.stringify(products));
  closeM();render();
}
function hapus(i){if(confirm('Hapus produk ini?')){products.splice(i,1);localStorage.setItem('fatir_products',JSON.stringify(products));render();}}
render();
</script>
</body>
  </html>
